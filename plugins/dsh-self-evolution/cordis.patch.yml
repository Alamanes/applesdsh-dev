# dsh-self-evolution bundle patch.
#
# The row materializes the evolution host plugin (collector, candidate queue,
# skill provider, memory tracks, tools, commands, HTTP routes). The browser
# half rides the package's `dsh.client` manifest.
#
# The row `name` MUST equal package.json's `name`: the client module system
# keys the bundle registration id by the package name.
#
# Optional services (`commands`, `connection`) are claimed through
# `ctx.inject()` inside the plugin, so a composition without them still gets
# the collector, the tools and the skill provider.
- insert:
    - id: self-evolution
      name: "dsh-self-evolution"
