# dsh-self-evolution bundle patch.
#
# One row per component. Each row is a separate package with its own locale
# entry, so the plugin manager lists them as the components of this bundle and
# each can be switched on its own. The rows hand runtime objects to each other
# through the shared record in `dsh-self-evolution-core`.
#
# The browser half rides this package's `dsh.client` manifest, so no component
# row owns a browser surface.
#
# Optional services (`commands`, `connection`, `skills`, `sessionProjections`)
# are claimed through `ctx.inject()` inside the rows, so a composition without
# them still gets the collector, the tools and the skill provider.
- insert:
    - id: se-ledger
      name: "dsh-self-evolution-core"

    - id: se-trace
      name: "dsh-self-evolution-trace"

    - id: se-model
      name: "dsh-self-evolution-llm"

    - id: se-portrait
      name: "dsh-self-evolution-portrait"

    - id: se-skills
      name: "dsh-self-evolution-skills"

    - id: se-candidates
      name: "dsh-self-evolution-candidates"

    - id: se-health
      name: "dsh-self-evolution-health"

    - id: se-collector
      name: "dsh-self-evolution-collector"

    - id: se-memory
      name: "dsh-self-evolution-memory"

    - id: se-flow
      name: "dsh-self-evolution-flow"

    - id: se-surface
      name: "dsh-self-evolution-surface"
