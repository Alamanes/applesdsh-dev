# dsh-ui-copy bundle patch.
#
# 声明在 package.json 的 dsh.bundle.patch 中，使 `dsh plugin add` 或插件页
# 安装时可直接把这一行插进所选 profile 的 cordis 配置。
#
# `id` 是 loader 行标签，与包名保持一致：插件页排障路径
# /plugins/<id>/client.js 才指向同一个字符串。
#
# 文案与强调色改在 profile 的 cordis.patch.yml 里追加同 id 的一行，例如：
#
#   - id: ui-copy
#     name: dsh-ui-copy
#     config:
#       hidePreviewBadge: true
#       headline:
#         zh: ['有什么可以帮你的？']
#       placeholders:
#         '描述你想要构建的内容, / 调用指令, @ 文件或对话': ['说点什么，剩下的我来']
#       accent:
#         light: '#7c4dff'
#         dark: '#b79cff'
#
# 这个组合包摊成两行，各自可以在插件页单独停用：
#
#   ui-copy      浏览器半只的文案改写与强调色覆写
#   ui-copy-ask  ask 弹窗的 OpenAI 视觉（宿主半只把 ask-surface.css 内联进页面）
- insert:
    - id: ui-copy
      name: dsh-ui-copy
    - id: ui-copy-ask
      name: dsh-ui-copy/ask
